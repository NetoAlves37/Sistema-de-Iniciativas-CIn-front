<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Iniciativas — CIn UFPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta do sketch */
  --branco:#FFFFFF; --cinza:#E3E3E3; --vermelho:#D91F2F; --vinho:#A60F28; --preto:#231F20;
  --bg:#F4F4F4; --surface:#FFFFFF; --surface-2:#EDEDED; --text:#231F20; --muted:#625C5D; --border:#D4D2D2;
  --campo:#E3E3E3; --campo-borda:#8C8889;
  --ro:#FFF4B8; --ro-borda:#C9B04A; --ro-text:#231F20;
  --ok:#1E9E4A; --ok-text:#FFFFFF; --amarelo:#F4D03F; --laranja:#F2A91B;
  --t-ext:#9BE0A0; --t-pes:#A7C7F2; --t-evt:#F7AE85; --chip-text:#231F20;
  --focus:#A60F28;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161314; --surface:#231F20; --surface-2:#2E292A; --text:#F3F0F0; --muted:#B5AEAF; --border:#3E3839;
    --campo:#2E292A; --campo-borda:#6E6869;
    --ro:#3A3317; --ro-borda:#8A7630; --ro-text:#F6EDC6;
    --t-ext:#2F6B3A; --t-pes:#2E4C75; --t-evt:#7A4027; --chip-text:#FFFFFF;
    --focus:#FF8A95; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161314; --surface:#231F20; --surface-2:#2E292A; --text:#F3F0F0; --muted:#B5AEAF; --border:#3E3839;
  --campo:#2E292A; --campo-borda:#6E6869;
  --ro:#3A3317; --ro-borda:#8A7630; --ro-text:#F6EDC6;
  --t-ext:#2F6B3A; --t-pes:#2E4C75; --t-evt:#7A4027; --chip-text:#FFFFFF;
  --focus:#FF8A95; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Barra do protótipo */
.proto{background:#231F20;color:#EDEAEA;font-size:.85rem}
.proto .in{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.proto strong{color:#fff}
.proto select,.proto input{background:#2E292A;color:#fff;border:1px solid #57504F;border-radius:4px;padding:4px 6px}
.proto input[type=number]{width:4.2em}
.proto .pbtn{background:#3A3435;color:#fff;border:1px solid #57504F;border-radius:4px;padding:4px 10px;cursor:pointer}
.proto .pbtn:hover{background:#4a4344}
.proto details{position:relative}
.proto summary{cursor:pointer;list-style:none;padding:4px 10px;border:1px solid #57504F;border-radius:4px}
.proto summary::-webkit-details-marker{display:none}
.proto .pop{position:absolute;right:0;top:calc(100% + 6px);background:#2A2526;border:1px solid #57504F;border-radius:6px;padding:12px;width:280px;z-index:20;display:grid;gap:8px}
.proto .pop label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.proto .pop p{margin:0;color:#B5AEAF;font-size:.8rem}
.proto .sp{flex:1}

/* Cabeçalho */
header.top{background:var(--surface);border-bottom:4px solid var(--vermelho)}
header.top .in{max-width:1120px;margin:0 auto;padding:14px 16px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark{width:40px;height:40px;background:var(--vermelho);border-radius:10px 10px 10px 2px;display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:1.2rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand small{color:var(--muted);font-size:.8rem}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--vinho);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.who .perf{color:var(--muted);font-size:.8rem;display:block}
nav.main{display:flex;flex-wrap:wrap;gap:8px;padding:14px 0 14px}

/* Botões (vermelho do sketch) */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--vermelho);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:600;font-size:.9rem;text-decoration:none;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--vinho)}
.btn.active{background:var(--vinho);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--campo-borda)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ok{background:var(--ok);color:var(--ok-text)}
.btn.ok:hover{filter:brightness(.92)}
.btn.gray{background:var(--cinza);color:#231F20}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.back{padding:6px 12px;font-size:1rem}
.count{background:#fff;color:var(--vinho);border-radius:10px;padding:0 7px;font-size:.75rem;font-weight:700}

main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.2}
h2{font-size:1.1rem;font-weight:700;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin-bottom:18px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hint{color:var(--muted);font-size:.85rem}
.empty{color:var(--muted);padding:18px 0;margin:0}

/* Lista em linhas (como as linhas do sketch) */
.list{border-top:1px solid var(--border)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.row:hover{background:var(--surface-2)}
.rank{font-weight:800;font-size:1.1rem;color:var(--vermelho);min-width:2.2em;text-align:center}
.tipo-dot{width:12px;height:12px;border-radius:3px;margin:0 6px}
.row-title{font-weight:700;display:block}
.row-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:2px}
.row-res{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:.9rem;color:var(--muted);margin-top:2px}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.82rem;color:var(--muted);text-align:right}
.mini-votes{display:inline-flex;gap:8px;align-items:center}
.mini-votes span{display:inline-flex;gap:3px;align-items:center}
@media (max-width:640px){.row{grid-template-columns:auto minmax(0,1fr)}.row-side{grid-column:2;align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}}

/* Chips de tipo e status */
.tipo{display:inline-block;padding:1px 8px;border-radius:3px;font-size:.78rem;font-weight:600;color:var(--chip-text)}
.tp-ext{background:var(--t-ext)} .tp-pes{background:var(--t-pes)} .tp-evt{background:var(--t-evt)}
.badge{display:inline-block;padding:3px 9px;border-radius:3px;font-size:.78rem;font-weight:700;white-space:nowrap}
.st-rascunho{background:var(--cinza);color:#231F20}
.st-andamento{background:var(--amarelo);color:#231F20}
.st-votacao{background:var(--vinho);color:#fff}
.st-analise{background:var(--laranja);color:#231F20}
.st-aprovada{background:var(--ok);color:#fff}
.st-reprovada{background:var(--vermelho);color:#fff}

/* Detalhe */
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.title-pill{background:var(--vermelho);color:#fff;font-weight:800;font-size:1.25rem;padding:6px 14px;border-radius:4px;line-height:1.25}
.byline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted);font-size:.9rem;margin:6px 0 18px}
.stepper{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:4px;overflow-x:auto}
.stepper li{flex:1 0 110px;display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.stepper .dot{height:6px;border-radius:3px;background:var(--cinza)}
.stepper li.done .dot{background:var(--vinho)}
.stepper li.cur{color:var(--text)}
.stepper li.cur .dot{background:var(--vermelho)}
.stepper li.good .dot{background:var(--ok)}
.stepper li.bad .dot{background:var(--vermelho)}
.callout{border-left:5px solid var(--vermelho);background:var(--surface);border-radius:0 6px 6px 0;padding:12px 16px;margin-bottom:18px;border-top:1px solid var(--border);border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.callout p{margin:0}
.callout p+p{margin-top:6px}
.callout.ok{border-left-color:var(--ok)}
.callout.warn{border-left-color:var(--laranja)}
.callout.info{border-left-color:var(--vinho)}
.actions-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ro-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ro{background:var(--ro);border:1px solid var(--ro-borda);border-radius:4px;padding:8px 12px;color:var(--ro-text)}
.ro .lbl{display:block;font-size:.75rem;font-weight:700;opacity:.8}
.ro .val{white-space:pre-wrap;overflow-wrap:anywhere}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
@media (max-width:820px){.ro-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.ro-grid{grid-template-columns:1fr}.span2{grid-column:auto}}
.gallery{display:flex;gap:8px;flex-wrap:wrap}
.gallery img{width:120px;height:90px;object-fit:cover;border-radius:4px;border:1px solid var(--ro-borda)}

/* Votação */
.vote-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vote{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--campo-borda);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:800;font-size:1.05rem;cursor:pointer}
.vote:hover:not([disabled]){border-color:var(--text)}
.vote.up.on{background:var(--ok);border-color:var(--ok);color:#fff}
.vote.down.on{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.vote[disabled]{cursor:default;opacity:.7}
.relev{flex:1 1 220px;min-width:200px}
.meter{height:8px;background:var(--vermelho);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.relev small{color:var(--muted)}

/* Comentários */
.comments{display:grid;gap:14px;margin:6px 0 14px}
.cmt{display:grid;grid-template-columns:auto 1fr;gap:10px}
.cmt .head{font-size:.85rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmt .head b{color:var(--text)}
.cmt p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:.72rem;font-weight:700;padding:0 6px;border-radius:3px;background:var(--surface-2);color:var(--text)}
.tag.autor{background:var(--vermelho);color:#fff}
.cycle-sep{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--border);padding-top:8px}

/* Formulário (campos cinza do sketch) */
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:820px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}}
.fld label,.fld .lbl{display:block;font-size:.85rem;font-weight:700;margin-bottom:4px}
.fld .opt{font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--campo);border:1px solid var(--campo-borda);border-radius:4px;padding:9px 10px}
.fld textarea{resize:vertical;min-height:90px}
.fld [aria-invalid=true]{border-color:var(--vermelho);box-shadow:0 0 0 1px var(--vermelho)}
.fld .err{color:var(--vermelho);font-size:.8rem;margin:4px 0 0;min-height:0}
.fld .help{color:var(--muted);font-size:.78rem;margin:4px 0 0}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fotos-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.thumb{position:relative}
.thumb img{width:90px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--campo-borda);display:block}
.thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--preto);color:#fff;cursor:pointer;font-size:.9rem;line-height:1}
.add-foto{display:inline-grid;place-items:center;width:90px;height:70px;border:2px dashed var(--campo-borda);border-radius:4px;color:var(--muted);cursor:pointer;font-size:.8rem;text-align:center}
.add-foto input{position:absolute;width:1px;height:1px;opacity:0}
.form-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:20px}

/* Decisão */
.dec-btns{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.blocked{background:var(--surface-2);border-radius:4px;padding:10px 12px;margin:8px 0 0}
#just-box{margin-top:8px}
#just-box label{display:inline-block;background:var(--vermelho);color:#fff;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:3px;margin-bottom:6px}
#just-box textarea{width:100%;background:var(--campo);border:1px solid var(--campo-borda);border-radius:4px;padding:9px 10px;min-height:100px}

/* Tabela */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:.8rem;color:var(--muted);font-weight:700}
td a.tlink{font-weight:700;text-decoration:none}
td a.tlink:hover{text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{border:1px solid var(--campo-borda);background:var(--surface);border-radius:4px;padding:5px 10px;font-size:.85rem;cursor:pointer}
.fchip.on{background:var(--preto);color:#fff;border-color:var(--preto)}

/* Aprovadas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--campo);border:1px solid var(--campo-borda);border-radius:4px;padding:8px 10px}
.toolbar input{flex:1 1 240px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.acard:hover{border-color:var(--vermelho)}
.acard .cover{height:120px;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:var(--chip-text)}
.acard .cover img{width:100%;height:120px;object-fit:cover}
.acard .body{padding:12px 14px;display:grid;gap:4px}
.acard .body b{font-size:1rem}
.acard .body span{font-size:.85rem;color:var(--muted)}

/* Calendário */
.cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cal-head h2{text-transform:capitalize;min-width:10em;font-size:1.25rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cal-wrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border);min-width:720px}
.cal .dow{font-size:.8rem;font-weight:700;text-align:center;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2)}
.cal .cell{min-height:104px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.cal .cell.out{background:var(--bg)}
.cal .num{font-size:.78rem;font-weight:700;color:var(--muted)}
.cal .today .num{background:var(--vermelho);color:#fff;border-radius:3px;padding:0 5px;align-self:flex-start}
.cal .ev{display:block;font-size:.74rem;font-weight:600;padding:2px 5px;border-radius:3px;text-decoration:none;color:var(--chip-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Calendário estilo Google */
.gcal{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.gcal{grid-template-columns:1fr}}
.gcal-side{display:grid;gap:14px}
.gcal-side h3{font-size:.9rem;margin:0 0 6px}
.gcal-side .chk{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;font-size:.92rem}
.gcal-side .chk input{width:18px;height:18px;margin:0;accent-color:var(--vinho)}
.gcal-side .sw{width:14px;height:14px;border-radius:3px;flex:none}
.gcal-side p{margin:0;font-size:.82rem;color:var(--muted)}
.gcal-main{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px}
.gcal-main .fc{--fc-border-color:var(--border);--fc-page-bg-color:var(--surface);--fc-neutral-bg-color:var(--surface-2);--fc-list-event-hover-bg-color:var(--surface-2);--fc-today-bg-color:transparent;--fc-now-indicator-color:var(--vermelho);--fc-button-bg-color:var(--surface);--fc-button-border-color:var(--campo-borda);--fc-button-text-color:var(--text);--fc-button-hover-bg-color:var(--surface-2);--fc-button-hover-border-color:var(--campo-borda);--fc-button-active-bg-color:var(--vermelho);--fc-button-active-border-color:var(--vermelho);font-size:.9rem}
.gcal-main .fc .fc-toolbar{flex-wrap:wrap;gap:8px}
.gcal-main .fc .fc-toolbar-title{font-size:1.3rem;font-weight:700;text-transform:capitalize;margin-left:8px}
.gcal-main .fc .fc-button{border-radius:4px;font-weight:600;box-shadow:none;text-transform:none}
.gcal-main .fc .fc-button-primary:not(:disabled).fc-button-active{color:#fff}
.gcal-main .fc .fc-today-button{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.gcal-main .fc .fc-today-button:disabled{opacity:.55}
.gcal-main .fc .fc-col-header-cell-cushion{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:capitalize;padding:6px 4px}
.gcal-main .fc .fc-daygrid-day-number{font-size:.8rem;font-weight:600;color:var(--text);text-decoration:none;margin:4px;min-width:24px;height:24px;display:grid;place-items:center;border-radius:50%;padding:0}
.gcal-main .fc .fc-day-today .fc-daygrid-day-number{background:var(--vermelho);color:#fff}
.gcal-main .fc .fc-day-today.fc-col-header-cell .fc-col-header-cell-cushion{color:var(--vermelho)}
.gcal-main .fc .fc-daygrid-day.fc-day-other{background:var(--bg)}
.gcal-main .fc a{color:inherit}
.gcal-main .fc .fc-event{border:0;border-radius:4px;cursor:pointer;padding:1px 2px}
.gcal-main .fc .fc-event .fc-event-main,.gcal-main .fc .fc-event .fc-event-time,.gcal-main .fc .fc-event .fc-event-title{color:var(--chip-text);font-weight:600}
.gcal-main .fc .fc-tp-ext{background:var(--t-ext)} .gcal-main .fc .fc-tp-pes{background:var(--t-pes)} .gcal-main .fc .fc-tp-evt{background:var(--t-evt)}
.gcal-main .fc .fc-list-event.fc-event{background:transparent}
.gcal-main .fc .fc-list-event .fc-event-title,.gcal-main .fc .fc-list-event .fc-event-time{color:var(--text);font-weight:500}
.gcal-main .fc .fc-tp-ext .fc-list-event-dot{border-color:var(--t-ext)} .gcal-main .fc .fc-tp-pes .fc-list-event-dot{border-color:var(--t-pes)} .gcal-main .fc .fc-tp-evt .fc-list-event-dot{border-color:var(--t-evt)}
.gcal-main .fc .fc-list-day-cushion{background:var(--surface-2)}
.gcal-main .fc .fc-timegrid-slot-label-cushion,.gcal-main .fc .fc-timegrid-axis-cushion{font-size:.75rem;color:var(--muted)}

<script>

/* ---------- utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const isoDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseDay=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtDay=s=>s?parseDay(s).toLocaleDateString('pt-BR'):'—';
const fmtTs=ts=>new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtRem(ms){if(ms<=0)return 'encerrado';const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/HOUR),m=Math.floor(ms%HOUR/60000);return d?`${d}d ${h}h`:h?`${h}h ${m}min`:`${Math.max(m,1)}min`}

/* Relevância: limite inferior do intervalo de Wilson (95%) */
function wilson(pos,n){if(!n)return 0;const z=1.96,p=pos/n;return (p+z*z/(2*n)-z*Math.sqrt((p*(1-p)+z*z/(4*n))/n))/(1+z*z/n)}
const score=it=>{const c=counts(it);return wilson(c.l,c.l+c.d)};
const byRelev=(a,b)=>{const ca=counts(a),cb=counts(b);return score(b)-score(a)||(cb.l+cb.d)-(ca.l+ca.d)||a.criadaEm-b.criadaEm};

/* ---------- persistência ---------- */

    mk({autorId:'u1',tipo:'Pesquisa',titulo:'Grupo de Estudos em IA Responsável',resumo:'Encontros semanais para ler e discutir artigos sobre viés, transparência e ética em IA.',detalhe:'Cada encontro tem um relator que apresenta um artigo. Ao final do semestre, o grupo produz um relatório técnico aberto.',inicio:d(-12),fim:d(60),periodicidade:'Semanal',organizadores:'Ana Souza',membros:'Bruno Lima (orientador)',participantes:20,espaco:'Sala E-112',status:'aprovada',votos:V(21,2),decisorId:'u3',decididaEm:base-20*DAY,criadaEm:base-40*DAY,historico:H([[-38,null,'rascunho','u1','Rascunho criado'],[-37,'rascunho','andamento','u1','Disponibilizada para refinamento'],[-30,'andamento','votacao','sistema','Prazo de refinamento encerrado'],[-25,'votacao','analise','sistema','Prazo de votação encerrado'],[-20,'analise','aprovada','u3','Aprovada pelo comitê']])}),

    mk({autorId:'u2',tipo:'Extensão',titulo:'Plantão de Dúvidas de Algoritmos',resumo:'Plantão quinzenal aberto a qualquer estudante com dúvidas de Algoritmos e Estruturas de Dados.',detalhe:'Monitores e professor se revezam. Não precisa de inscrição.',inicio:d(-20),fim:d(40),periodicidade:'Quinzenal',organizadores:'Bruno Lima',membros:'Monitores de AED',participantes:30,espaco:'Sala D-005',status:'aprovada',votos:V(15,1),decisorId:'u3',decididaEm:base-22*DAY,criadaEm:base-35*DAY,historico:fluxoAprov('u2')}),

    mk({autorId:'u2',tipo:'Evento',titulo:'Maratona Interna de Programação',resumo:'Seletiva interna para formar os times do CIn na Maratona SBC.',detalhe:'Prova de 5 horas no estilo ICPC, com problemas inéditos.',inicio:d(30),fim:d(30),periodicidade:'Evento único',organizadores:'Bruno Lima',membros:'Treinadores da maratona',participantes:60,espaco:'Laboratórios G1 e G2',status:'votacao',fimRefinamento:base-2*DAY,fimVotacao:base+DAY,votos:V(6,0),historico:H([[-6,null,'rascunho','u2','Rascunho criado'],[-5,'rascunho','andamento','u2','Disponibilizada para refinamento'],[-2,'andamento','votacao','sistema','Prazo de refinamento encerrado']])}),
    mk({autorId:'u1',tipo:'Evento',titulo:'Sala de Descompressão Gamer',resumo:'Espaço com consoles e jogos de tabuleiro aberto nos intervalos, durante a semana de provas.',detalhe:'Uso de uma sala ociosa durante a semana de provas, com escala de voluntários.',inicio:d(35),fim:d(40),periodicidade:'Diária',organizadores:'Ana Souza',membros:'',participantes:25,espaco:'Sala E-201',status:'votacao',fimRefinamento:base-DAY,fimVotacao:base+3*DAY,votos:V(9,11),historico:H([[-5,null,'rascunho','u1','Rascunho criado'],[-4,'rascunho','andamento','u1','Disponibilizada para refinamento'],[-1,'andamento','votacao','sistema','Prazo de refinamento encerrado']])}),

    mk({autorId:'u3',tipo:'Pesquisa',titulo:'Laboratório Aberto de Robótica',resumo:'Abertura do laboratório de robótica às sextas para projetos de alunos de qualquer período.',detalhe:'Alunos propõem projetos curtos e usam kits do laboratório com supervisão de um bolsista.',inicio:d(14),fim:d(90),periodicidade:'Semanal',organizadores:'Carla Menezes',membros:'Bolsistas do laboratório',participantes:15,espaco:'Laboratório de Robótica',status:'analise',fimRefinamento:base-5*DAY,fimVotacao:base-DAY,votos:V(22,4),historico:H([[-9,null,'rascunho','u3','Rascunho criado'],[-8,'rascunho','andamento','u3','Disponibilizada para refinamento'],[-5,'andamento','votacao','sistema','Prazo de refinamento encerrado'],[-1,'votacao','analise','sistema','Prazo de votação encerrado']])}),

/* ---------- transições automáticas por prazo ---------- */
function tick(){
  let ch=false;const t=now();
  for(const it of S.items){
    if(it.status==='andamento'&&it.fimRefinamento&&t>=it.fimRefinamento){
      it.status='votacao';it.fimVotacao=it.fimRefinamento+S.cfg.votacao*DAY;
      it.historico.push({ts:it.fimRefinamento,de:'andamento',para:'votacao',por:'sistema',nota:'Prazo de refinamento encerrado'});ch=true;
    }
    if(it.status==='votacao'&&it.fimVotacao&&t>=it.fimVotacao){
      it.status='analise';
      it.historico.push({ts:it.fimVotacao,de:'votacao',para:'analise',por:'sistema',nota:'Prazo de votação encerrado'});ch=true;
    }
  }
  if(ch)save();
  return ch;
}

        <span><b>Sistema de Iniciativas</b><small>Centro de Informática — UFPE</small></span>

function resizeImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=900,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function readForm(){
  const f=document.getElementById('form-ini').elements, g=n=>(f[n].value||'').trim();
  return {tipo:g('tipo'),titulo:g('titulo'),resumo:g('resumo'),detalhe:g('detalhe'),inicio:g('inicio'),fim:g('fim'),periodicidade:g('periodicidade'),horaInicio:g('horaInicio'),horaFim:g('horaFim'),organizadores:g('organizadores'),membros:g('membros'),participantes:parseInt(g('participantes'),10)||0,espaco:g('espaco'),fotos:FORM_FOTOS.slice()};

function validate(d){
  const e={};
  if(!d.tipo)e.tipo='Selecione o tipo.';
  if(!d.titulo)e.titulo='Informe o título.';
  if(!d.resumo)e.resumo='Escreva uma descrição resumida.';
  if(!d.detalhe)e.detalhe='Escreva a descrição detalhada.';
  if(!d.inicio)e.inicio='Informe a data de início.';
  if(!d.fim)e.fim='Informe a data de término.';
  if(d.inicio&&d.fim&&d.fim<d.inicio)e.fim='A data de término deve ser igual ou posterior à de início.';
  if(!d.periodicidade)e.periodicidade='Selecione a periodicidade.';
  if(d.horaInicio&&!d.horaFim)e.horaFim='Informe a hora de término ou apague a de início.';
  if(!d.horaInicio&&d.horaFim)e.horaInicio='Informe a hora de início ou apague a de término.';
  if(d.horaInicio&&d.horaFim&&d.horaFim<=d.horaInicio)e.horaFim='A hora de término deve ser posterior à de início.';
  if(!d.organizadores)e.organizadores='Informe ao menos um organizador.';

}
function showErrors(e){

  f.querySelectorAll('[data-err]').forEach(p=>p.textContent='');
  f.querySelectorAll('[aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
  let first=null;
  for(const [k,msg] of Object.entries(e)){
    const p=f.querySelector(`[data-err="${k}"]`);if(p)p.textContent=msg;
    const el=f.elements[k];if(el){el.setAttribute('aria-invalid','true');first=first||el}
  }

}
function abrirRefinamento(it,nota){const de=it.status;it.status='andamento';it.fimRefinamento=now()+S.cfg.refino*DAY;it.fimVotacao=null;log(it,de,'andamento',S.userId,nota)}
function newItem(d,status){return Object.assign({id:'i'+(++S.seq),autorId:S.userId,status,ciclo:1,votos:{},comentarios:[],historico:[],justificativa:'',decisorId:null,decididaEm:null,fimRefinamento:null,fimVotacao:null,criadaEm:now()},d)}

/* ---------- Detalhe ---------- */
function stepper(it){
  const order=['rascunho','andamento','votacao','analise','final'];
  const lab={rascunho:'Rascunho',andamento:'Em andamento',votacao:'Em votação',analise:'Em análise',final:it.status==='reprovada'?'Reprovada':'Aprovada'};
  const cur=['aprovada','reprovada'].includes(it.status)?4:order.indexOf(it.status);
  return `<ol class="stepper" aria-label="Etapas">${order.map((k,i)=>`<li class="${i<cur?'done':''}${i===cur?' cur':''}${i===4&&cur===4?(it.status==='reprovada'?' bad':' good'):''}"${i===cur?' aria-current="step"':''}><span class="dot"></span><span>${lab[k]}</span></li>`).join('')}</ol>`;
}
function callout(it){
  const t=now();
  switch(it.status){
    case 'rascunho':return `<div class="callout info"><p>Este rascunho só é visível para você. Ao submeter, a iniciativa fica ${S.cfg.refino} dia(s) aberta a sugestões.</p></div>`;
    case 'andamento':return `<div class="callout warn"><p><strong>Aberta a sugestões até ${fmtTs(it.fimRefinamento)}</strong> (${fmtRem(it.fimRefinamento-t)} restantes).</p><p>Depois disso a votação abre automaticamente e a edição é bloqueada.</p></div>`;
    case 'votacao':return `<div class="callout info"><p><strong>Votação aberta até ${fmtTs(it.fimVotacao)}</strong> (${fmtRem(it.fimVotacao-t)} restantes).</p><p>Os votos não aprovam nem reprovam; servem para ordenar as iniciativas por relevância.</p></div>`;
    case 'analise':return `<div class="callout warn"><p><strong>Aguardando a decisão do comitê avaliador.</strong></p></div>`;
    case 'aprovada':return `<div class="callout ok"><p><strong>Aprovada em ${fmtTs(it.decididaEm)}</strong> por ${esc(uname(it.decisorId))}, em nome do comitê. Já aparece em Iniciativas aprovadas e no Calendário.</p></div>`;
    case 'reprovada':return `<div class="callout"><p><strong>Reprovada em ${fmtTs(it.decididaEm)}</strong> por ${esc(uname(it.decisorId))}, em nome do comitê.</p><p><strong>Justificativa:</strong> ${esc(it.justificativa)}</p>${it.autorId===S.userId?'<p>Você pode editar e ressubmeter quantas vezes quiser. A iniciativa volta para sugestões e votação.</p>':''}</div>`;
  }
  return '';
}

function votePanel(it){

/* ---------- Minhas iniciativas ---------- */
function marco(it){
  switch(it.status){
    case 'rascunho':return 'Ainda não submetida';
    case 'andamento':return `Sugestões até ${fmtTs(it.fimRefinamento)}`;
    case 'votacao':return `Votação até ${fmtTs(it.fimVotacao)}`;
    case 'analise':return 'Aguardando o comitê';
    case 'aprovada':return `Aprovada em ${fmtTs(it.decididaEm)}`;
    case 'reprovada':return 'Pode editar e ressubmeter';
  }
}
function viewMinhas(){
  const mine=S.items.filter(i=>i.autorId===S.userId).sort((a,b)=>b.criadaEm-a.criadaEm);
  if(!mine.length)return `<div class="page-head"><div><h1>Minhas iniciativas</h1></div></div><div class="card"><p class="empty">Você ainda não submeteu nenhuma iniciativa.</p><a class="btn" href="#/nova">Submeter iniciativa</a></div>`;
  const cnt={};mine.forEach(i=>cnt[i.status]=(cnt[i.status]||0)+1);
  const list=MINHAS_FILTRO==='todas'?mine:mine.filter(i=>i.status===MINHAS_FILTRO);
  return `<div class="page-head"><div><h1>Minhas iniciativas</h1><p class="sub">Acompanhe o status de cada iniciativa que você propôs.</p></div><a class="btn" href="#/nova">Submeter iniciativa</a></div>
  <div class="card">
    <div class="filters" role="group" aria-label="Filtrar por status"><button class="fchip${MINHAS_FILTRO==='todas'?' on':''}" data-action="filtro" data-st="todas">Todas (${mine.length})</button>${Object.keys(STATUS).filter(s=>cnt[s]).map(s=>`<button class="fchip${MINHAS_FILTRO===s?' on':''}" data-action="filtro" data-st="${s}">${STATUS[s].label} (${cnt[s]})</button>`).join('')}</div>
    <div class="table-wrap"><table><thead><tr><th>Iniciativa</th><th>Tipo</th><th>Status</th><th>Próximo passo</th><th>Votos</th><th><span class="sr">Ações</span></th></tr></thead><tbody>
    ${list.map(it=>{const c=counts(it);return `<tr><td><a class="tlink" href="#/i/${it.id}">${esc(it.titulo)}</a></td><td>${tipoChip(it.tipo)}</td><td>${badge(it.status)}</td><td>${marco(it)}</td><td><span class="mini-votes"><span>${ico('up')}${c.l}</span><span>${ico('down')}${c.d}</span></span></td><td>${EDITABLE.includes(it.status)?`<a class="btn ghost" href="#/editar/${it.id}">Editar</a>`:''}</td></tr>`}).join('')}
    </tbody></table></div>
  </div>`;
}

/* ---------- Aprovadas ---------- */
function aprovadasList(q,tipo){
  q=(q||'').toLowerCase();
  const list=S.items.filter(i=>i.status==='aprovada'&&(!tipo||i.tipo===tipo)&&(!q||(i.titulo+' '+i.resumo+' '+i.organizadores+' '+i.espaco).toLowerCase().includes(q))).sort((a,b)=>a.inicio.localeCompare(b.inicio));
  if(!list.length)return empty('Nenhuma iniciativa aprovada corresponde à busca.');
  return `<div class="cards">${list.map(it=>`<a class="acard" href="#/i/${it.id}"><div class="cover tp-${TC[it.tipo]}">${it.fotos[0]?`<img src="${it.fotos[0]}" alt="">`:esc(it.titulo[0])}</div><div class="body">${tipoChip(it.tipo)}<b>${esc(it.titulo)}</b><span>${it.inicio===it.fim?fmtDay(it.inicio):fmtDay(it.inicio)+' a '+fmtDay(it.fim)}, ${esc(it.periodicidade.toLowerCase())}</span><span>${esc(it.espaco)}</span></div></a>`).join('')}</div>`;
}
function viewAprovadas(){
  return `<div class="page-head"><div><h1>Iniciativas aprovadas</h1><p class="sub">Todas as iniciativas aprovadas pelo comitê, visíveis a qualquer usuário do sistema.</p></div><a class="btn ghost" href="#/calendario">Ver no calendário</a></div>
  <div class="toolbar"><input id="busca" type="search" placeholder="Buscar por título, organizador ou espaço" aria-label="Buscar"><select id="f-tipo-ap" aria-label="Filtrar por tipo"><option value="">Todos os tipos</option>${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></div>
  <div id="ap-list">${aprovadasList()}</div>`;
}

/* ---------- Calendário ---------- */
function occurs(it,day){
  if(!it.inicio||!it.fim)return false;
  const s=parseDay(it.inicio),e=parseDay(it.fim);if(day<s||day>e)return false;
  const diff=Math.round((day-s)/DAY);
  switch(it.periodicidade){case 'Semanal':return diff%7===0;case 'Quinzenal':return diff%14===0;case 'Mensal':return day.getDate()===s.getDate();default:return true}
}
function viewCalGrid(){
  if(!CAL){const d=new Date(now());CAL={y:d.getFullYear(),m:d.getMonth()}}
  const first=new Date(CAL.y,CAL.m,1),start=first.getDay(),days=new Date(CAL.y,CAL.m+1,0).getDate(),today=isoDate(now());
  const aprov=S.items.filter(i=>i.status==='aprovada');
  const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let cells='';
  for(let i=0;i<start;i++)cells+='<div class="cell out"></div>';
  for(let d=1;d<=days;d++){
    const day=new Date(CAL.y,CAL.m,d),ev=aprov.filter(it=>occurs(it,day));
    cells+=`<div class="cell${isoDate(day)===today?' today':''}"><span class="num">${d}</span>${ev.map(it=>`<a class="ev tp-${TC[it.tipo]}" href="#/i/${it.id}" title="${esc(it.titulo)} (${esc(it.espaco)})">${esc(it.titulo)}</a>`).join('')}</div>`;
  }
  const tail=(7-(start+days)%7)%7;for(let i=0;i<tail;i++)cells+='<div class="cell out"></div>';
  return `<div class="page-head"><div><h1>Calendário</h1><p class="sub">Iniciativas aprovadas, nas datas definidas pelo período e pela periodicidade.</p></div></div>
  <div class="card"><div class="cal-head"><button class="btn ghost" data-action="cal" data-d="-1" aria-label="Mês anterior">‹</button><h2>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn ghost" data-action="cal" data-d="1" aria-label="Próximo mês">›</button><button class="btn ghost" data-action="cal" data-d="0">Hoje</button>
  <div class="legend">${TIPOS.map(t=>`<span><span class="tipo-dot tp-${TC[t]}" style="margin:0"></span>${t}</span>`).join('')}</div></div>
  <div class="cal-wrap"><div class="cal">${dows.map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div></div></div>`;
}

let FC=null;
const CS={view:null,date:null,tipos:{'Extensão':true,'Pesquisa':true,'Evento':true},mine:false};
const addDays=(s,n)=>{const d=parseDay(s);d.setDate(d.getDate()+n);return isoDate(d.getTime())};
function gcalUrl(it){
  const d=s=>s.replace(/-/g,''),t=h=>h.replace(':','')+'00';
  const multi=it.inicio!==it.fim;
  let dates,rule='';
  if(it.horaInicio){dates=`${d(it.inicio)}T${t(it.horaInicio)}/${d(it.inicio)}T${t(it.horaFim)}`}
  else{dates=`${d(it.inicio)}/${d(addDays(it.periodicidade==='Evento único'?it.fim:it.inicio,1))}`}
  const F={'Diária':'FREQ=DAILY','Semanal':'FREQ=WEEKLY','Quinzenal':'FREQ=WEEKLY;INTERVAL=2','Mensal':'FREQ=MONTHLY'};
  if(F[it.periodicidade]&&multi)rule=F[it.periodicidade];
  else if(it.periodicidade==='Evento único'&&multi&&it.horaInicio)rule='FREQ=DAILY';
  const p={action:'TEMPLATE',text:it.titulo,dates,ctz:'America/Recife',details:`${it.resumo}\n\nOrganizadores: ${it.organizadores}\nIniciativa aprovada no Sistema de Iniciativas do CIn/UFPE.`,location:`${it.espaco}, Centro de Informática - UFPE`};
  if(rule)p.recur=`RRULE:${rule};UNTIL=${d(it.fim)}`;
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams(p).toString();
}
function buildEvents(start,end){
  const out=[];
  const list=S.items.filter(i=>i.status==='aprovada'&&i.inicio&&CS.tipos[i.tipo]&&(!CS.mine||i.autorId===S.userId));
  for(const it of list){
    const base={title:it.titulo,classNames:['fc-tp-'+TC[it.tipo]],extendedProps:{iid:it.id}};
    if(it.periodicidade==='Evento único'&&!it.horaInicio){out.push(Object.assign({id:it.id,start:it.inicio,end:addDays(it.fim,1),allDay:true},base));continue}
    const day=new Date(start.getFullYear(),start.getMonth(),start.getDate());
    for(;day<end;day.setDate(day.getDate()+1)){
      if(!occurs(it,day))continue;
      const iso=isoDate(day.getTime());
      out.push(Object.assign(it.horaInicio?{id:it.id+'-'+iso,start:iso+'T'+it.horaInicio,end:iso+'T'+it.horaFim,allDay:false}:{id:it.id+'-'+iso,start:iso,allDay:true},base));
    }
  }
  return out;
}
function viewCal(){
  if(!window.FullCalendar)return viewCalGrid();
  return `<div class="page-head"><div><h1>Calendário</h1><p class="sub">Iniciativas aprovadas. Clique em um evento para ver os detalhes ou adicioná-lo ao seu Google Agenda.</p></div></div>
  <div class="gcal">
    <aside class="gcal-side">
      <a class="btn" href="#/nova">Submeter iniciativa</a>
      <div><h3>Tipos de iniciativa</h3>${TIPOS.map(t=>`<label class="chk"><input type="checkbox" class="cal-tipo" value="${t}"${CS.tipos[t]?' checked':''}><span class="sw tp-${TC[t]}"></span>${t}</label>`).join('')}</div>
      <div><h3>Exibir</h3><label class="chk"><input type="checkbox" id="cal-mine"${CS.mine?' checked':''}>Só as minhas iniciativas</label></div>
    </aside>
    <div class="gcal-main"><div id="fc"></div></div>
  </div>
  <div id="ev-pop" class="ev-pop" role="dialog" aria-modal="false" aria-labelledby="ev-pop-t" hidden></div>`;
}
function mountCal(){
  const el=document.getElementById('fc');if(!el||!window.FullCalendar)return;
  const narrow=window.matchMedia('(max-width:640px)').matches;
  FC=new FullCalendar.Calendar(el,{
    locale:'pt-br',
    initialView:CS.view||(narrow?'listMonth':'dayGridMonth'),
    initialDate:CS.date||new Date(now()),
    now:()=>new Date(now()),
    headerToolbar:narrow?{left:'prev,next today',center:'',right:'title'}:{left:'today prev,next title',center:'',right:'dayGridMonth,timeGridWeek,timeGridDay,listMonth'},
    footerToolbar:narrow?{center:'dayGridMonth,timeGridWeek,timeGridDay,listMonth'}:false,
    buttonText:{today:'Hoje',month:'Mês',week:'Semana',day:'Dia',list:'Agenda'},
    height:'auto',firstDay:0,nowIndicator:true,dayMaxEvents:3,eventDisplay:'block',
    slotMinTime:'07:00:00',slotMaxTime:'23:00:00',allDayText:'Dia todo',
    noEventsText:'Nenhuma iniciativa aprovada neste período.',
    eventTimeFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
    slotLabelFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
    events:(info,ok)=>ok(buildEvents(info.start,info.end)),
    eventClick:info=>{info.jsEvent.preventDefault();showPop(info.event,info.el)},
    datesSet:info=>{CS.view=info.view.type;CS.date=info.view.currentStart;hidePop()}
  });
  FC.render();
}
function showPop(ev,anchor){
  const it=get(ev.extendedProps.iid);if(!it)return;
  const pop=document.getElementById('ev-pop');
  const dia=ev.start.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const quando=ev.allDay?(it.periodicidade==='Evento único'&&it.inicio!==it.fim?`${fmtDay(it.inicio)} a ${fmtDay(it.fim)}, dia todo`:`${dia}, dia todo`):`${dia}, ${it.horaInicio} às ${it.horaFim}`;
  pop.innerHTML=`<div class="top"><button class="x" data-action="fechar-pop" aria-label="Fechar">×</button></div>
    <div class="ttl"><span class="sw tp-${TC[it.tipo]}"></span><div><h3 id="ev-pop-t">${esc(it.titulo)}</h3><span class="hint" style="text-transform:none">${quando}</span></div></div>
    <dl><dt>Tipo</dt><dd>${esc(it.tipo)}</dd><dt>Repete</dt><dd>${esc(it.periodicidade)}${it.inicio!==it.fim?`, até ${fmtDay(it.fim)}`:''}</dd><dt>Local</dt><dd>${esc(it.espaco)}</dd><dt>Organização</dt><dd>${esc(it.organizadores)}</dd></dl>
    <div class="acts"><a class="btn" href="#/i/${it.id}">Ver iniciativa</a><a class="btn ghost" href="${esc(gcalUrl(it))}" target="_blank" rel="noopener">Adicionar ao Google Agenda</a></div>`;
  pop.hidden=false;
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let left=r.right+8;if(left+w>window.innerWidth-12)left=Math.max(12,r.left-w-8);
  let top=Math.min(Math.max(12,r.top),window.innerHeight-h-12);
  pop.style.left=left+'px';pop.style.top=top+'px';
  pop.querySelector('.x').focus();
}
function hidePop(){const p=document.getElementById('ev-pop');if(p)p.hidden=true}

/* ---------- Em análise (comitê) ---------- */
function viewAnalise(){
  if(me().perfil!=='comite')return notFound('Esta área é exclusiva do comitê avaliador.');
  const list=S.items.filter(i=>i.status==='analise').sort(byRelev);
  return `<div class="page-head"><div><h1>Iniciativas em análise</h1><p class="sub">Ordenadas por relevância na votação da comunidade. Os votos são só uma referência para a reunião do comitê.</p></div></div>
  <section class="card">${list.length?`<div class="list">${list.map((it,i)=>rowHTML(it,{rank:i+1,votes:true,extra:it.autorId===S.userId?'<span class="tag autor">Você é o autor</span>':''})).join('')}</div>`:empty('Nenhuma iniciativa aguardando decisão.')}</section>`;
}

/* ---------- roteamento ---------- */
function route(scroll){
  if(FC){FC.destroy();FC=null}
  tick();
  const h=(location.hash||'#/home').replace(/^#\/?/,'');
  const [p,id]=h.split('/');
  let view;
  switch(p){
    case '':case 'home':view=viewHome();break;
    case 'nova':view=viewForm();break;
    case 'editar':view=viewForm(id);break;
    case 'minhas':view=viewMinhas();break;
    case 'i':view=viewDetail(id);break;
    case 'aprovadas':view=viewAprovadas();break;
    case 'calendario':view=viewCal();break;
    case 'analise':view=viewAnalise();break;
    default:view=notFound('Página não encontrada.');
  }
  document.getElementById('chrome').innerHTML=chrome(p||'home');
  document.getElementById('app').innerHTML=view;
  if(p==='nova'||p==='editar')renderFotos();
  if(p==='calendario')mountCal();
  if(scroll!==false&&LAST_PAGE!==h){window.scrollTo(0,0)}
  LAST_PAGE=h;
}
const isForm=()=>/^#\/(nova|editar)/.test(location.hash);

/* ---------- ações ---------- */
const A={
  back(){if(history.length>1)history.back();else location.hash='#/home'},
  avancar(el){S.offset+=Number(el.dataset.ms);save();route(false);toast('Data simulada: '+fmtTs(now()))},
  'tempo-real'(){S.offset=0;save();route(false)},
  restaurar(){if(confirm('Restaurar os dados de exemplo? Tudo o que você criou será apagado.')){S=seed();save();MINHAS_FILTRO='todas';CAL=null;location.hash='#/home';route();toast('Dados de exemplo restaurados')}},
  'salvar-rascunho'(){
    const d=readForm();if(!d.titulo){showErrors({titulo:'Informe ao menos o título para salvar o rascunho.'});return}
    let it;if(FORM_ID){it=get(FORM_ID);Object.assign(it,d)}else{it=newItem(d,'rascunho');S.items.push(it);log(it,null,'rascunho',S.userId,'Rascunho criado')}
    save();toast('Rascunho salvo');location.hash='#/i/'+it.id;
  },
  submeter(){
    const d=readForm(),e=validate(d);if(Object.keys(e).length){showErrors(e);toast('Revise os campos destacados.');return}
    let it;if(FORM_ID){it=get(FORM_ID);Object.assign(it,d)}else{it=newItem(d,'rascunho');S.items.push(it);log(it,null,'rascunho',S.userId,'Rascunho criado')}
    abrirRefinamento(it,'Submetida e aberta a sugestões');save();toast('Iniciativa submetida e aberta a sugestões');location.hash='#/i/'+it.id;
  },
  salvar(){
    tick();const it=get(FORM_ID);
    if(it.status!=='andamento'){toast('O prazo de sugestões terminou e a edição foi bloqueada.');location.hash='#/i/'+it.id;return}
    const d=readForm(),e=validate(d);if(Object.keys(e).length){showErrors(e);toast('Revise os campos destacados.');return}
    Object.assign(it,d);log(it,'andamento','andamento',S.userId,'Iniciativa editada durante o refinamento');save();toast('Alterações salvas');location.hash='#/i/'+it.id;
  },
  ressubmeter(){
    const it=get(FORM_ID),d=readForm(),e=validate(d);if(Object.keys(e).length){showErrors(e);toast('Revise os campos destacados.');return}
    Object.assign(it,d);it.ciclo++;it.votos={};it.justificativa='';it.decisorId=null;it.decididaEm=null;
    abrirRefinamento(it,`Ressubmetida após reprovação (ciclo ${it.ciclo})`);save();toast('Iniciativa ressubmetida e aberta a sugestões');location.hash='#/i/'+it.id;
  },
  disponibilizar(el){
    const it=get(el.dataset.id);
    if(Object.keys(validate(it)).length){toast('Complete os campos obrigatórios antes de submeter.');location.hash='#/editar/'+it.id;return}
    abrirRefinamento(it,'Submetida e aberta a sugestões');save();route(false);toast('Iniciativa submetida e aberta a sugestões');
  },
  excluir(el){if(!confirm('Excluir este rascunho? Essa ação não pode ser desfeita.'))return;S.items=S.items.filter(i=>i.id!==el.dataset.id);save();toast('Rascunho excluído');location.hash='#/minhas'},
  'remover-foto'(el){FORM_FOTOS.splice(Number(el.dataset.i),1);renderFotos()},
  vote(el){
    tick();const it=get(el.dataset.id);
    if(it.status!=='votacao'){toast('A votação desta iniciativa foi encerrada.');route(false);return}
    const v=Number(el.dataset.v),cur=it.votos[S.userId]||0;
    if(cur===v){delete it.votos[S.userId];toast('Voto retirado')}else{it.votos[S.userId]=v;toast(cur?'Voto alterado':'Voto registrado')}
    save();route(false);
  },
  comentar(el){
    tick();const it=get(el.dataset.id),ta=document.getElementById('novo-cmt'),txt=(ta?.value||'').trim();
    if(it.status!=='andamento'){toast('A fase de sugestões terminou.');route(false);return}
    if(!txt){document.getElementById('cmt-err').textContent='Escreva sua sugestão antes de enviar.';ta.focus();return}
    it.comentarios.push({id:'k'+(++S.kseq),autorId:S.userId,texto:txt,ts:now(),ciclo:it.ciclo});save();route(false);toast('Sugestão enviada');
  },
  aprovar(el){
    const it=get(el.dataset.id);if(it.autorId===S.userId||it.status!=='analise')return;
    if(!confirm(`Registrar a aprovação de "${it.titulo}"?`))return;
    it.status='aprovada';it.decisorId=S.userId;it.decididaEm=now();log(it,'analise','aprovada',S.userId,'Aprovada pelo comitê');save();route(false);toast('Iniciativa aprovada');
  },
  'reprovar-abrir'(){const b=document.getElementById('just-box');b.hidden=false;document.getElementById('just').focus()},
  'reprovar-cancelar'(){document.getElementById('just-box').hidden=true},
  'reprovar-confirmar'(el){
    const it=get(el.dataset.id);if(it.autorId===S.userId||it.status!=='analise')return;
    const j=document.getElementById('just'),txt=j.value.trim();
    if(!txt){document.getElementById('just-err').textContent='A justificativa é obrigatória para reprovar.';j.setAttribute('aria-invalid','true');j.focus();return}
    it.status='reprovada';it.justificativa=txt;it.decisorId=S.userId;it.decididaEm=now();log(it,'analise','reprovada',S.userId,'Reprovada pelo comitê');save();route(false);toast('Iniciativa reprovada');
  },
  'fechar-pop'(){hidePop()},
  filtro(el){MINHAS_FILTRO=el.dataset.st;route(false)},
  cal(el){const d=Number(el.dataset.d);if(!d){const n=new Date(now());CAL={y:n.getFullYear(),m:n.getMonth()}}else{const n=new Date(CAL.y,CAL.m+d,1);CAL={y:n.getFullYear(),m:n.getMonth()}}route(false)}
};
document.addEventListener('click',e=>{const pop=document.getElementById('ev-pop');if(pop&&!pop.hidden&&!pop.contains(e.target)&&!e.target.closest('.fc-event'))hidePop();const el=e.target.closest('[data-action]');if(!el)return;const fn=A[el.dataset.action];if(fn){e.preventDefault();fn(el)}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='user-sel'){S.userId=t.value;save();MINHAS_FILTRO='todas';route(false);toast('Agora você está como '+me().nome)}
  if(t.id==='cfg-refino'||t.id==='cfg-votacao'){const v=parseFloat(t.value);if(v>0){S.cfg[t.id==='cfg-refino'?'refino':'votacao']=v;save();toast('Prazo atualizado')}}
  if(t.id==='foto-input'){
    const files=[...t.files].slice(0,4-FORM_FOTOS.length);
    for(const f of files){try{FORM_FOTOS.push(await resizeImg(f))}catch(err){toast('Não foi possível ler '+f.name)}}
    renderFotos();
  }
  if(t.classList.contains('cal-tipo')){CS.tipos[t.value]=t.checked;FC&&FC.refetchEvents()}
  if(t.id==='cal-mine'){CS.mine=t.checked;FC&&FC.refetchEvents()}
  if(t.id==='f-tipo-ap')document.getElementById('ap-list').innerHTML=aprovadasList(document.getElementById('busca').value,t.value);
});
document.addEventListener('input',e=>{if(e.target.id==='busca')document.getElementById('ap-list').innerHTML=aprovadasList(e.target.value,document.getElementById('f-tipo-ap').value)});
window.addEventListener('hashchange',()=>route());
document.addEventListener('keydown',e=>{if(e.key==='Escape')hidePop()});
setInterval(()=>{const ch=tick();const busy=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(!isForm()&&!busy&&!/^#\/calendario/.test(location.hash))route(false);else if(ch&&FC)FC.refetchEvents()},30000);

load();route();
})();
</script>
